name: Mobile graph engineering
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/mobile_graph.py'
      - 'scripts/mobile-webgpu-check.mjs'
      - '.github/workflows/mobile-graph.yml'
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy onnx onnxruntime
      - name: Retrieve exact previously tested model
        run: |
          curl --fail --location --retry 3 -o source.onnx https://quantumq1981.github.io/Guitar-Piano-Audio-Stem-Extract/models/mobile.onnx
          echo '1333aa4a748126703b2824286c6a38dd0774491f7b2ad9fb802eba190191946f  source.onnx' | sha256sum --check
      - name: Selective graph folding and CPU parity
        run: /usr/bin/time -v python scripts/mobile_graph.py source.onnx candidate.onnx graph-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-mobile-graph
          path: |
            candidate.onnx
            graph-report.json
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Chromium WebGPU software adapter gate
        timeout-minutes: 15
        run: node scripts/mobile-webgpu-check.mjs
