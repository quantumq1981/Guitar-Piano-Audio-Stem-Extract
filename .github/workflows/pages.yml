# Builds the PWA (apps/web) and publishes it to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Optional: Settings → Secrets and variables → Actions → Variables → VITE_API_BASE
#   = HTTPS URL of a running `stemsplit serve` (needed for phones/tablets, tracks
#   over 90 s, and the guitar lead/rhythm split). Without it the site runs
#   on-device jobs only.
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Headless tests (core + web)
        run: npx vitest run packages/core apps/web

      - name: Build PWA
        env:
          # Project sites are served from https://<owner>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build:web

      - name: Disable Jekyll
        run: touch apps/web/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
