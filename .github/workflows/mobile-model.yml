name: Build experimental mobile model
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mobile-model.yml'
      - 'scripts/fold_webgpu.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy onnx onnxruntime
      - name: Download upstream FP16 weights
        run: curl --fail --location --retry 3 -o source.onnx https://huggingface.co/StemSplitio/htdemucs-6s-onnx/resolve/main/htdemucs_6s_fp16weights.onnx
      - name: Fold and verify candidate
        run: |
          python scripts/fold_webgpu.py source.onnx mobile.onnx
          echo '1333aa4a748126703b2824286c6a38dd0774491f7b2ad9fb802eba190191946f  mobile.onnx' | sha256sum --check
          test "$(stat -c%s mobile.onnx)" = 143359115
      - uses: actions/upload-artifact@v4
        with:
          name: verified-mobile-model
          path: mobile.onnx
          retention-days: 7
