# Builds the PWA (apps/web) and publishes it to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Optional: Settings → Secrets and variables → Actions → Variables → VITE_API_BASE
#   = HTTPS URL of a running `stemsplit serve` (needed for phones/tablets, tracks
#   over 90 s, and the guitar lead/rhythm split). Without it the site runs
#   on-device jobs only.
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    # Song uploads trigger "Separate songs", not a site rebuild.
    paths-ignore:
      - 'inbox/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Headless tests (core + web)
        run: npx vitest run packages/core apps/web

      - name: Build PWA
        env:
          # Project sites are served from https://<owner>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build:web

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate verified experimental model
        run: |
          pip install numpy onnx onnxruntime
          curl --fail --location --retry 3 -o /tmp/source.onnx https://huggingface.co/StemSplitio/htdemucs-6s-onnx/resolve/main/htdemucs_6s_fp16weights.onnx
          mkdir -p apps/web/dist/models
          python scripts/fold_webgpu.py /tmp/source.onnx apps/web/dist/models/mobile.onnx
          echo '1333aa4a748126703b2824286c6a38dd0774491f7b2ad9fb802eba190191946f  apps/web/dist/models/mobile.onnx' | sha256sum --check
          test "$(stat -c%s apps/web/dist/models/mobile.onnx)" = 143359115

      # Stage IV low-memory candidate for the opt-in device test (docs/MOBILE-INFERENCE-DEVELOPMENT.md).
      # Deterministic rebuild from the verified mobile.onnx; both files must match the SHA-256 pins in
      # packages/core/src/models/mobile-experimental.ts, or the deploy fails.
      - name: Generate verified Stage IV low-memory model
        run: |
          python -m venv /tmp/stage4 && /tmp/stage4/bin/pip install -q numpy==2.4.6 onnx==1.23.2 onnxruntime==1.32.0
          mkdir -p /tmp/stage4-build
          /tmp/stage4/bin/python scripts/mobile_graph.py apps/web/dist/models/mobile.onnx /tmp/stage4-build/candidate.onnx /tmp/stage4-build/graph-report.json > /dev/null
          (cd /tmp/stage4-build && /tmp/stage4/bin/python "$GITHUB_WORKSPACE/scripts/mobile_memory.py" candidate.onnx candidate-memory.onnx memory-report.json --external-data --accurate-reductions --no-verify)
          node --input-type=module -e "import('./packages/core/src/models/mobile-experimental.ts').then(({ MOBILE_STAGE4_CANDIDATE: c }) => { for (const f of [c.graph, c.data]) console.log(f.sha256 + '  /tmp/stage4-build/' + f.file); })" > /tmp/stage4-build/SHA256SUMS
          cat /tmp/stage4-build/SHA256SUMS
          sha256sum --check /tmp/stage4-build/SHA256SUMS
          cp /tmp/stage4-build/candidate-memory.onnx /tmp/stage4-build/candidate-memory.onnx.data apps/web/dist/models/

      - name: Disable Jekyll
        run: touch apps/web/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
